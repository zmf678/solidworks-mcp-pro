# Upstream-only publishing. This fork keeps the workflow for reference, but the
# publish jobs are guarded so a release in zmf678/solidworks-mcp-pro can never
# overwrite the upstream PyPI package or MCP Registry entry.
name: Publish (upstream repository only)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Unit tests (the runner has no SolidWorks)
        run: uv run --extra dev pytest -m "not solidworks"

  pypi:
    needs: test
    if: github.repository == 'hjbaard/SolidWorks-MCP'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/solidworks-mcp
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    if: github.repository == 'hjbaard/SolidWorks-MCP'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish

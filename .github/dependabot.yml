version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # mcp 2.x renamed FastMCP; the server imports mcp.server.fastmcp.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-mcp"
version = "0.20.0"
description = "MCP server that drives a local SolidWorks instance over COM for parametric part modelling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Henk Jan Baard" }, { name = "zmf678" }]
maintainers = [{ name = "zmf678" }]
keywords = ["solidworks", "mcp", "cad", "com", "parametric", "3d-printing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Windows-only; elsewhere the server starts and lists its tools, calls fail loud.
    "pywin32>=306; sys_platform == 'win32'",
    # mcp 2.x renamed FastMCP (server.py fails on import); 1.26+ is verified.
    "mcp>=1.26,<2",
]

[project.urls]
Homepage = "https://github.com/zmf678/solidworks-mcp-pro"
Repository = "https://github.com/zmf678/solidworks-mcp-pro"
Upstream = "https://github.com/hjbaard/SolidWorks-MCP"
Changelog = "https://github.com/zmf678/solidworks-mcp-pro/blob/main/CHANGELOG.md"
Issues = "https://github.com/zmf678/solidworks-mcp-pro/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "twine>=5",
]

[project.scripts]
solidworks-mcp = "solidworks_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solidworks_mcp = ["guide.md", "guide.zh-CN.md", "material_ids.json"]  # guide resources; English material ids

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "solidworks: integration test that needs a running SolidWorks instance",
]

[tool.coverage.run]
source = ["solidworks_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 35
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["solidworks_mcp"]

[tool.mypy]
python_version = "3.11"
files = [
    "src/solidworks_mcp/units.py",
    "src/solidworks_mcp/errors.py",
    "src/solidworks_mcp/com_worker.py",
    "src/solidworks_mcp/binding.py",
    "src/solidworks_mcp/session/_decorators.py",
    "src/solidworks_mcp/session/_constants.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
